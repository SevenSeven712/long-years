# 将静态内容部署到 GitHub Pages 的简单工作流
名称: 将静态内容部署到 Pages

在:
  # 仅在推送到默认分支时运行
 推送:
    分支: ["main"]

  # 允许您从“Actions”选项卡手动运行此工作流
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限，以允许部署到 GitHub Pages
权限:
  内容: 读取
  页面: 写入
  ID 令牌: 写入

# 仅允许一次并发部署，跳过正在进行的部署与最新排队任务之间的所有排队任务。
# 但是，请勿取消正在进行中的运行，因为我们希望这些生产部署能够顺利完成。
并发:
 组: "pages"
 取消进行中: false

作业:
  # 由于我们只是进行部署，因此使用单个部署作业
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
步骤:
      - 名称: Checkout
用途: actions/checkout@v4
      - 名称: 设置 Pages
使用actions/configure-pages@v5
      - 名称: 上载制品
: actions/upload-pages-artifact@v3
 附带:
          # 上传整个仓库
          路径: '.'
      - 名称: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
